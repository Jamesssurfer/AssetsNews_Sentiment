name: Scan asset sentiment

on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert-tone

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scanner.py

      - name: Rebuild dashboard
        run: python dashboard.py

      - name: Commit and push results
        run: |
          git config user.name "asset-sentiment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/asset_sentiment_log.xlsx index.html
          git diff --cached --quiet || git commit -m "Scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
